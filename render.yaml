services:
  - type: web
    name: nestlio
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && cd frontend && npm ci && npm run build"
    # 2026-09-01 마이그레이션 스쿼시: 51개 체인 → 단일 베이스라인(bdba3c3b3277). 스쿼시 후
    # 첫 배포 전에 운영 DB에 `alembic stamp bdba3c3b3277`를 1회 실행해야 한다(안 하면 이
    # startCommand가 CREATE TABLE 충돌로 실패). 이후 배포는 그대로 둔다. 상세는
    # migrations/versions/bdba3c3b3277_squashed_baseline.py 상단 주석.
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      # 컨테이너 기본 TZ는 UTC다. 앱은 naive datetime을 "KST 벽시계"로 취급하므로
      # (event_service가 구글 일정을 KST naive로 저장) 프로세스 TZ를 Asia/Seoul로 고정한다 —
      # 이러면 date.today()/datetime.now()도 KST가 된다. 코드는 app/utils/dates.py의
      # now_kst()/today_kst()로 한 번 더 방어하지만, 라우터가 파싱하는 날짜 경계까지 맞추려면
      # 이 값이 필요하다.
      - key: TZ
        value: Asia/Seoul
      # production이면 config.py의 시동 검증이 필수 시크릿 누락 시 부팅을 막는다(fail-fast).
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: nestlio-media
      # 실제 배포 도메인(Render가 할당하는 https://<service>.onrender.com)은 첫 배포 후에만
      # 알 수 있으므로 값을 미리 채우지 않는다 - 대시보드에서 배포 후 직접 채운다.
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: NOTIFY_EMAIL_TO
        sync: false
      - key: GROWLIO_API_BASE_URL
        sync: false
      - key: INTERNAL_JOB_SECRET
        generateValue: true
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      # 코칭 임계값은 여기서 하드코딩하지 않는다 — 정본은 app/config.py 기본값이고, 부부가
      # 조정한 값은 설정 화면(coaching_settings_service, Postgres user_settings)이 우선한다.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
