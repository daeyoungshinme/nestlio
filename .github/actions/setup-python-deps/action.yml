name: setup-python-deps
description: .python-version 파이썬 + pip 캐시(키는 requirements 두 파일로 통일) + 의존성 설치
inputs:
  install-args:
    description: pip install 인자
    default: "-r requirements.txt -r requirements-dev.txt"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version-file: ".python-version"
        cache: "pip"
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    - run: pip install ${{ inputs.install-args }}
      shell: bash
