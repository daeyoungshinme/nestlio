name: nestlio scheduled jobs

# Render 무료 웹서비스는 15분 미사용 시 슬립하고, 인프로세스 스케줄러를 유지할 수 없다.
# 대신 이 워크플로가 GitHub Actions cron으로 깨어나 /internal/jobs/{name}을 호출한다.
# 시간은 전부 UTC (GitHub Actions는 cron에 타임존을 지원하지 않음, KST = UTC+9).
# workflow_dispatch(수동 실행)로 돌리면 요일/말일 조건과 무관하게 6개 잡이 모두 실행된다 (동작 확인용).
on:
  schedule:
    # daily_due_date_check: 매일 07:00 KST = 전날 22:00 UTC
    - cron: "0 22 * * *"
    # weekly_summary_email(매주 월 08:00 KST) + monthly_summary_email(매월 1일 08:00 KST)
    # 둘 다 23:00 UTC 트리거이며, 아래 스텝에서 요일/말일 여부로 각각 분기한다.
    - cron: "0 23 * * *"
    # monthly_net_worth_snapshot: 매월 1일 08:05 KST = 전월 말일 23:05 UTC
    - cron: "5 23 * * *"
    # daily_threshold_safety_net: 매일 20:00 KST = 11:00 UTC
    - cron: "0 11 * * *"
    # event_reminder_check: 15분 간격
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# 같은 cron끼리만 직렬화한다(느린 event_reminder_check(*/15)가 다음 틱과 겹치지 않게). 진행 중인
# 실행은 죽이지 않고(요약 이메일 발송 중 취소 방지) 뒤 실행이 대기하도록 cancel-in-progress: false.
# 그룹을 cron별로 나누는 이유: GitHub은 그룹당 "대기 중" 실행을 1개만 유지하고 새로 들어온 실행이
# 기존 대기 실행을 취소한다 — 단일 그룹이면 22:00/23:00/23:05 잡이 */15 틱과 겹칠 때 조용히 유실된다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  call-internal-job:
    runs-on: ubuntu-latest
    # 매달린 실행이 cancel-in-progress:false 직렬화 큐를 막지 않도록. 각 curl은 --max-time 170.
    timeout-minutes: 10
    env:
      APP_URL: ${{ secrets.APP_URL }}
      INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - name: verify required secrets
        run: |
          missing=""
          [ -z "$APP_URL" ] && missing="$missing APP_URL"
          [ -z "$INTERNAL_JOB_SECRET" ] && missing="$missing INTERNAL_JOB_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — set them under Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: daily_due_date_check
        if: github.event.schedule == '0 22 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS --retry 2 --retry-delay 15 --retry-all-errors --max-time 170 -X POST "$APP_URL/internal/jobs/daily-due-date-check" \
            -H "X-Internal-Job-Secret: $INTERNAL_JOB_SECRET"

      # 요일/말일 판정은 실행 시점의 KST 날짜로 한다 — cron 실행이 수십 분 밀려 UTC 자정을 넘겨도
      # KST로는 여전히 "월요일 08시대 / 1일 08시대"라 판정이 흔들리지 않는다. 재실행돼도
      # 서버 쪽 already_sent/스냅샷 upsert가 중복을 막는다.
      - name: weekly_summary_email (Mon 08:00 KST = Sun 23:00 UTC)
        if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ] || [ -n "$FORCE_RUN" ]; then
            curl -fsS --retry 2 --retry-delay 15 --retry-all-errors --max-time 170 -X POST "$APP_URL/internal/jobs/weekly-summary-email" \
              -H "X-Internal-Job-Secret: $INTERNAL_JOB_SECRET"
          else
            echo "not Monday KST, skipping weekly_summary_email"
          fi

      - name: monthly_summary_email (1st 08:00 KST = last day of month 23:00 UTC)
        if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$(TZ=Asia/Seoul date +%d)" = "01" ] || [ -n "$FORCE_RUN" ]; then
            curl -fsS --retry 2 --retry-delay 15 --retry-all-errors --max-time 170 -X POST "$APP_URL/internal/jobs/monthly-summary-email" \
              -H "X-Internal-Job-Secret: $INTERNAL_JOB_SECRET"
          else
            echo "not the 1st (KST), skipping monthly_summary_email"
          fi

      - name: monthly_net_worth_snapshot (1st 08:05 KST = last day of month 23:05 UTC)
        if: github.event.schedule == '5 23 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$(TZ=Asia/Seoul date +%d)" = "01" ] || [ -n "$FORCE_RUN" ]; then
            curl -fsS --retry 2 --retry-delay 15 --retry-all-errors --max-time 170 -X POST "$APP_URL/internal/jobs/monthly-net-worth-snapshot" \
              -H "X-Internal-Job-Secret: $INTERNAL_JOB_SECRET"
          else
            echo "not the 1st (KST), skipping monthly_net_worth_snapshot"
          fi

      - name: daily_threshold_safety_net
        if: github.event.schedule == '0 11 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS --retry 2 --retry-delay 15 --retry-all-errors --max-time 170 -X POST "$APP_URL/internal/jobs/daily-threshold-safety-net" \
            -H "X-Internal-Job-Secret: $INTERNAL_JOB_SECRET"

      - name: event_reminder_check
        if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS --retry 2 --retry-delay 15 --retry-all-errors --max-time 170 -X POST "$APP_URL/internal/jobs/event-reminder-check" \
            -H "X-Internal-Job-Secret: $INTERNAL_JOB_SECRET"

      # growlio(자산관리 앱)는 Render 무료 티어라 15분 미사용 시 슬립하는데 nestlio처럼
      # self-ping하는 워크플로가 없어, nestlio -> growlio 호출(계좌/부동산 동기화 등)이
      # growlio_client.py의 5초 타임아웃보다 긴 콜드스타트에 걸려 느려지거나 실패한다.
      # 이 잡이 이미 15분 간격으로 도는 김에 growlio도 함께 깨워둔다. 실패해도(시크릿 미설정
      # 포함) 다른 잡을 막지 않는 best-effort라 || true로 무시한다.
      - name: warm_up_growlio
        if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
        env:
          GROWLIO_APP_URL: ${{ secrets.GROWLIO_APP_URL }}
        run: |
          if [ -z "$GROWLIO_APP_URL" ]; then
            echo "GROWLIO_APP_URL secret not set, skipping growlio warm-up"
          else
            curl -fsS --max-time 10 "$GROWLIO_APP_URL/health" || echo "growlio warm-up failed (ignored)"
          fi
