name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pip check
      # 런타임 의존성(requirements.txt)만 취약점 스캔 — dev 전용(pytest/ruff 등)은 배포에 안 들어간다.
      # 무해하다고 판단한 취약점은 `--ignore-vuln GHSA-xxxx`(사유 주석)로 화이트리스트.
      - run: PYTHONUTF8=1 pip-audit -r requirements.txt --progress-spinner off
      - run: pytest -v

  # 모델 ↔ 마이그레이션 드리프트 가드. test_migrations.py는 체인 무결성만 보므로,
  # 컬럼 추가 후 리비전 생성을 잊으면 배포(alembic upgrade head) 후에야 터진다.
  # 임베디드 Postgres(household 스키마)가 필요해 backend job과 분리한다.
  migration-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt pgserver
      - run: python scripts/check_migration_drift.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # high 이상 취약점이 있으면 실패. dev/빌드타임 의존성 포함(프론트는 전부 클라이언트로
      # 나가거나 빌드에 쓰임). 상위에서 아직 못 고치는 전이 취약점은 package.json `overrides` 로 고정.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-anon-key"

  # 손으로 옮긴 frontend/src/types/index.ts 는 정본이지만, 백엔드 스키마가 바뀌었는데
  # 그 사실을 프론트에 반영하지 않는 드리프트를 잡을 방법이 없었다. api.generated.ts 를
  # 추적 파일로 두고, 여기서 FastAPI 스키마로 재생성한 뒤 커밋된 것과 달라지면 실패시킨다.
  # (스키마를 바꾼 PR은 `npm run generate:api-types` 를 돌려 재생성 파일을 함께 커밋해야 한다.)
  api-types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api-types
        working-directory: frontend
      - name: fail if api.generated.ts is stale
        run: git diff --exit-code -- frontend/src/types/api.generated.ts
